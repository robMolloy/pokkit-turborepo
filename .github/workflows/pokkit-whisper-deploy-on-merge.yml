# https://github.com/firebase/firebase-tools

name: Pokkit Whisper Deploy on Merge
on:
  push:
    branches:
      - main
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      whisper: ${{ steps.filter.outputs.whisper }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            whisper:
              - 'apps/pokkit-whisper/**'
              - 'packages/pokkit-shadcn/**'
              - 'packages/pokkit-components/**'
              - 'packages/ui/**'
              - 'firebase.json'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - '.github/workflows/pokkit-whisper-deploy-on-merge.yml'

  build_and_deploy:
    needs: changes
    if: ${{ needs.changes.outputs.whisper == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Install pnpm
      - uses: pnpm/action-setup@v3
        with:
          version: 9

      # Setup Node (and enable caching for pnpm)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - run: pnpm i
      - run: pnpm add -g turbo
      - run: pnpm run build-whisper
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_POKKIT_WHISPA }}
          channelId: live
          projectId: pokkit-whispa

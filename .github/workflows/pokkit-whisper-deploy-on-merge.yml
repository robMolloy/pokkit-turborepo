# https://github.com/firebase/firebase-tools

name: Pokkit Whisper Deploy on Merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Install pnpm
      - uses: pnpm/action-setup@v3
        with:
          version: 9

      # Setup Node (and enable caching for pnpm)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - run: pnpm i
      - run: pnpm add -g turbo
      - run: pnpm run build-whisper

      - name: Hash build output
        id: build_hash
        run: |
          HASH=$(find apps/pokkit-whisper/dist -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "Build hash: $HASH"

      # Restore only the most recent deploy marker (unique key always misses;
      # restore-keys picks the newest pokkit-whisper-latest-* entry).
      - name: Restore most recent deploy hash
        uses: actions/cache/restore@v4
        with:
          path: .whisper-deploy-marker
          key: pokkit-whisper-latest-${{ github.sha }}
          restore-keys: |
            pokkit-whisper-latest-

      - name: Compare with most recent deploy
        id: compare
        run: |
          NEW_HASH="${{ steps.build_hash.outputs.hash }}"
          if [ -f .whisper-deploy-marker/hash ]; then
            OLD_HASH=$(cat .whisper-deploy-marker/hash)
            echo "Most recent deploy hash: $OLD_HASH"
            if [ "$NEW_HASH" = "$OLD_HASH" ]; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "Build matches the most recent deploy — skipping Firebase deploy."
            else
              echo "changed=true" >> "$GITHUB_OUTPUT"
              echo "Build differs from the most recent deploy — deploying."
            fi
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "No previous deploy hash found — deploying."
          fi

      - uses: FirebaseExtended/action-hosting-deploy@v0
        if: steps.compare.outputs.changed == 'true'
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_POKKIT_WHISPA }}
          channelId: live
          projectId: pokkit-whispa

      - name: Record deployed build hash
        if: steps.compare.outputs.changed == 'true'
        run: |
          rm -rf .whisper-deploy-marker
          mkdir -p .whisper-deploy-marker
          echo "${{ steps.build_hash.outputs.hash }}" > .whisper-deploy-marker/hash
          date -u +%Y-%m-%dT%H:%M:%SZ > .whisper-deploy-marker/deployed-at

      - name: Save most recent deploy hash
        if: steps.compare.outputs.changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: .whisper-deploy-marker
          key: pokkit-whisper-latest-${{ github.sha }}

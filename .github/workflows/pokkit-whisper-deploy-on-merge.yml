# https://github.com/firebase/firebase-tools

name: Pokkit Whisper Deploy on Merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Install pnpm
      - uses: pnpm/action-setup@v3
        with:
          version: 9

      # Setup Node (and enable caching for pnpm)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - run: pnpm i
      - run: pnpm add -g turbo
      - run: pnpm run build-whisper

      - name: Hash build output
        id: build_hash
        run: |
          HASH=$(find apps/pokkit-whisper/dist -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "Build hash: $HASH"

      - name: Check if build matches a previous deploy
        id: previous_build
        uses: actions/cache/restore@v4
        with:
          path: .whisper-deploy-marker
          key: pokkit-whisper-dist-${{ steps.build_hash.outputs.hash }}

      - name: Skip deploy
        if: steps.previous_build.outputs.cache-hit == 'true'
        run: echo "Build output unchanged — skipping Firebase deploy."

      - uses: FirebaseExtended/action-hosting-deploy@v0
        if: steps.previous_build.outputs.cache-hit != 'true'
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_POKKIT_WHISPA }}
          channelId: live
          projectId: pokkit-whispa

      - name: Record deployed build hash
        if: steps.previous_build.outputs.cache-hit != 'true'
        run: |
          mkdir -p .whisper-deploy-marker
          echo "${{ steps.build_hash.outputs.hash }}" > .whisper-deploy-marker/hash
          date -u +%Y-%m-%dT%H:%M:%SZ > .whisper-deploy-marker/deployed-at

      - name: Save deployed build hash
        if: steps.previous_build.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .whisper-deploy-marker
          key: pokkit-whisper-dist-${{ steps.build_hash.outputs.hash }}

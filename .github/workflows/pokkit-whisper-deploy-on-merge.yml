name: Pokkit Whisper Deploy on Merge
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Install pnpm
      - uses: pnpm/action-setup@v3
        with:
          version: 9

      # Setup Node (and enable caching for pnpm)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - run: pnpm i
      - run: pnpm add -g turbo
      - run: pnpm run build-whisper

      - name: Upload build to recent artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pokkit-whisper-dist
          path: apps/pokkit-whisper/dist
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Download most recent build
        uses: actions/download-artifact@v4
        with:
          name: pokkit-whisper-dist
          path: apps/pokkit-whisper/dist

      - name: Download second most recent build
        id: previous
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          PREV_ID=$(gh api --paginate "repos/${{ github.repository }}/actions/artifacts" \
            --jq '.artifacts[] | select(.name == "pokkit-whisper-dist" and .expired == false and .workflow_run.id != ${{ github.run_id }}) | .id' \
            | head -n1)

          if [ -z "$PREV_ID" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No second-most-recent build found."
            exit 0
          fi

          echo "exists=true" >> "$GITHUB_OUTPUT"
          echo "Second most recent artifact id: $PREV_ID"
          mkdir -p previous-dist
          gh api "repos/${{ github.repository }}/actions/artifacts/${PREV_ID}/zip" > previous-dist.zip
          unzip -q previous-dist.zip -d previous-dist

      - name: Compare most recent two builds
        id: compare
        run: |
          set -euo pipefail

          hash_dir() {
            find "$1" -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1
          }

          NEW_HASH=$(hash_dir apps/pokkit-whisper/dist)
          echo "Most recent build hash: $NEW_HASH"

          if [ "${{ steps.previous.outputs.exists }}" != "true" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "No second-most-recent build — deploying most recent."
            exit 0
          fi

          OLD_HASH=$(hash_dir previous-dist)
          echo "Second most recent build hash: $OLD_HASH"

          if [ "$NEW_HASH" = "$OLD_HASH" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Most recent build matches second most recent — skipping deploy."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Most recent build differs from second most recent — deploying."
          fi

      - uses: FirebaseExtended/action-hosting-deploy@v0
        if: steps.compare.outputs.changed == 'true'
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_POKKIT_WHISPA }}
          channelId: live
          projectId: pokkit-whispa

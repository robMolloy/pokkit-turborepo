name: Pokkit Starter DB TS Testing on Merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Install pnpm
      - uses: pnpm/action-setup@v3
        with:
          version: 9

      # Setup Node (and enable caching for pnpm)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      # Needed by pre-test (go build of pokkit-starter-db)
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"

      - run: pnpm i
      - run: pnpm run test-once --filter=pokkit-starter-db-ts-testing
